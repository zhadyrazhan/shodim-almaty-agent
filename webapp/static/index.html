<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сходим · Алматы</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="app">
    <header class="header">
      <div class="topbar">
        <span class="status" id="status" title="Статус данных">
          <span class="status-dot"></span><span id="status-text">проверяем…</span>
        </span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <h1>Сходим<span class="accent">·</span>Алматы</h1>
      <p class="subtitle">Спроси, куда сходить — подскажу по свежей афише</p>
    </header>

    <section class="chips" id="chips"></section>

    <section class="chat-panel">
      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <p>Выбери вопрос или напиши свой. Советую только то, что реально есть в афише Алматы.</p>
        </div>
      </div>

      <form class="composer" id="composer">
        <input id="input" type="text" placeholder="Например: куда сходить с друзьями вечером?" autocomplete="off" />
        <button type="submit" id="send" aria-label="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </section>

    <footer class="footer">Данные с sxodim.com · ответы генерирует модель и может ошибаться</footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
